    color: var(--ink);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  html[data-mode="day"] body::before {
    content: "";
    position: fixed; inset: 0;
    background: linear-gradient(180deg, rgba(255, 226, 190, .55), rgba(255, 196, 150, .25) 45%, rgba(255, 240, 220, .35));
    pointer-events: none;
    z-index: 1;
  }

  /* CRT texture */
  body::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,.14) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 58%, rgba(4,2,12,.5) 100%);
    mix-blend-mode: multiply;
    z-index: 5;
  }
  html[data-mode="day"] body::after { opacity: .45; }

  /* ---------- stage ---------- */
  .stage {
    position: relative;
    z-index: 6;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 1.6vh, 20px);
    padding: max(4vh, env(safe-area-inset-top)) 20px max(6vh, env(safe-area-inset-bottom));
  }

  .clock {
    font: 300 clamp(44px, 8vw, 76px)/1 Consolas, "Cascadia Mono", ui-monospace, monospace;
    letter-spacing: .1em;
    color: #fff;
    text-shadow: 0 0 18px var(--glow-cyan), 0 0 46px var(--glow-magenta);
    cursor: pointer;
    user-select: none;
    transition: opacity .2s ease;
    position: relative;
    z-index: 2;
    padding-bottom: .15em;
    text-align: center;
  }
  .clock:hover { opacity: .85; }
  .clock .sec { font-size: .45em; opacity: .55; margin-left: .3em; }
  .clock small {
    display: block;
    width: fit-content;
    margin: .55em auto 0;
    font-size: clamp(11px, 1.1vw, 13px);
    letter-spacing: .30em;
    color: rgba(124, 246, 255, .9);
    background: rgba(6, 4, 18, .42);
    padding: 3px 12px 3px 14px;
    border-radius: 999px;
    text-shadow: none;
  }
  html[data-mode="day"] .clock { color: var(--ink); text-shadow: 0 1px 0 rgba(255,255,255,.4); }
  html[data-mode="day"] .clock small { color: var(--cyan); background: rgba(255, 248, 238, .6); }

  .search-wrap {
    position: relative;
    width: min(760px, 88vw);
  }
  form {
    width: 100%;
    display: flex;
    border-radius: 14px;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow:
      0 0 0 1px rgba(255, 92, 160, .16),
      0 0 30px var(--glow-cyan),
      0 18px 60px rgba(0, 0, 0, .55);
    backdrop-filter: blur(8px) saturate(125%);
  }

  /* ---------- suggestion panel ---------- */
  .suggest {
    position: absolute;
    top: calc(100% + 8px);
    left: 0; right: 0;
    z-index: 20;
    max-height: 46vh;
    overflow-y: auto;
    border-radius: 12px;
    background: rgba(10, 6, 26, .94);
    border: 1px solid var(--line);
    box-shadow: 0 18px 60px rgba(0, 0, 0, .6), 0 0 24px var(--glow-cyan);
    backdrop-filter: blur(12px) saturate(130%);
  }
  html[data-mode="day"] .suggest {
    background: rgba(255, 247, 238, .96);
    box-shadow: 0 18px 60px rgba(120, 80, 50, .25), 0 0 24px var(--glow-cyan);
  }
  .suggest[hidden] { display: none; }
  .suggest .sec {
    padding: 9px 14px 5px;
    font: 11px/1.4 Consolas, "Cascadia Mono", ui-monospace, monospace;
    letter-spacing: .22em;
    color: var(--dim);
    text-transform: uppercase;
  }
  .suggest .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    cursor: pointer;
    font-size: 14px;
    color: var(--ink);
  }
  .suggest .row .ico {
    width: 16px;
    flex: none;
    text-align: center;
    opacity: .5;
    font-size: 12px;
  }
  .suggest .row .txt {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .suggest .row .txt b { color: var(--cyan); font-weight: 600; }
  .suggest .row .n {
    font-size: 11px;
    color: var(--dim);
    flex: none;
  }
  .suggest .row .del {
    flex: none;
    opacity: 0;
    font-size: 11px;
    color: var(--dim);
    padding: 0 2px;
  }
  .suggest .row:hover .del { opacity: .7; }
  .suggest .row .del:hover { color: var(--magenta); }
  .suggest .row:hover,
  .suggest .row.active { background: rgba(124, 246, 255, .10); }
  html[data-mode="day"] .suggest .row:hover,
  html[data-mode="day"] .suggest .row.active { background: rgba(42, 127, 140, .12); }
  .suggest .foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    border-top: 1px solid rgba(124, 246, 255, .12);
    font-size: 11px;
    color: var(--dim);
  }
  .suggest .foot button {
    background: none; border: 0; cursor: pointer;
    color: var(--dim); font-size: 11px; padding: 0;
  }
  .suggest .foot button:hover { color: var(--magenta); }
  input[type="search"] {
    flex: 1;
    min-width: 0;
    padding: 15px 20px;
    border: 0; outline: 0;
    background: transparent;
    color: var(--ink);
    font-size: 16px;
  }
  input[type="search"]::placeholder { color: var(--dim); }
  button.go {
    width: 74px; border: 0; cursor: pointer;
    background: linear-gradient(180deg, #2a1e63, #170f38);
    color: var(--cyan);
    font-size: 18px;
    border-left: 1px solid var(--line);
    transition: background .18s ease;
  }
  button.go:hover { background: linear-gradient(180deg, #3a2a86, #1d1447); }
  html[data-mode="day"] button.go { background: linear-gradient(180deg, #ffe6cd, #f6d3b4); color: var(--cyan); }

  /* HUD strip: readable over the sun */
  .hud {
    font: clamp(10px, 1vw, 12px)/1.6 Consolas, "Cascadia Mono", ui-monospace, monospace;
    letter-spacing: .26em;
    color: rgba(124, 246, 255, .85);
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(6, 4, 18, .45);
    backdrop-filter: blur(4px);
    text-shadow: 0 0 10px var(--glow-cyan);
    pointer-events: none;
  }
  html[data-mode="day"] .hud { color: var(--cyan); background: rgba(255, 246, 235, .55); }

  .tiles {
    display: flex; gap: 10px; flex-wrap: wrap;
    justify-content: center; align-items: center;
    max-width: min(760px, 90vw);
  }
  .tiles a {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 14px;
    border-radius: 10px;
    text-decoration: none;
    color: var(--ink);
    font-size: clamp(12px, 1.1vw, 13px);
    background: var(--panel);
    border: 1px solid rgba(124, 246, 255, .16);
    backdrop-filter: blur(6px);
    transition: border-color .18s ease, transform .18s ease;
  }
  .tiles a:hover { border-color: rgba(255, 92, 160, .55); transform: translateY(-1px); }
  .tiles a .del { display: none; margin-left: 4px; opacity: .55; font-size: 11px; }
  body.editing .tiles a .del { display: inline; }
  body.editing .tiles a { border-color: rgba(255, 92, 160, .5); }
  .tiles .add { cursor: pointer; color: var(--dim); border-style: dashed; }

  /* short viewports: keep the date line clear of the search box */
  @media (max-height: 820px) {
    .clock { font-size: clamp(36px, 6vw, 58px); }
    .clock small { margin-top: .28em; }
    .stage { gap: clamp(8px, 1.2vh, 14px); }
  }
  @media (max-height: 620px) {
    .clock { font-size: clamp(30px, 5vw, 44px); }
    input[type="search"] { padding: 12px 16px; }
  }

  /* top-right controls */
  .controls {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    right: 16px;
    z-index: 7;
    display: flex; gap: 8px;
  }
  .controls button {
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border-radius: 10px;
    cursor: pointer;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid rgba(124, 246, 255, .18);
    backdrop-filter: blur(6px);
    font-size: 15px;
    transition: border-color .18s ease;
  }
  .controls button:hover { border-color: var(--magenta); }
  .controls button.on { border-color: var(--magenta); color: var(--magenta); }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    font-size: 12px; color: #ffd0e0;
    background: rgba(20, 8, 30, .8);
    padding: 8px 14px; border-radius: 8px;
    opacity: 0; transition: opacity .2s ease; z-index: 9;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <div class="controls">
    <button id="btnEdit" title="编辑快捷入口">✎</button>
    <button id="btnMode" title="切换昼/夜">☾</button>
  </div>

  <main class="stage">
    <div class="clock" id="clock" title="点击切换秒显示">--:--<small id="date"></small></div>

    <div class="search-wrap">
      <form id="search" action="https://www.bing.com/search" method="get" autocomplete="off">
        <input type="text" id="q" name="nh84q" inputmode="search" enterkeyhint="search"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               aria-autocomplete="list" role="searchbox"
               placeholder="搜索网页（/ 聚焦，Ctrl+Enter 新标签页）">
        <button class="go" type="submit" aria-label="搜索">⌕</button>
      </form>
      <div class="suggest" id="suggest" hidden></div>
    </div>

    <div class="hud">SYS.84 &nbsp;//&nbsp; NEON HORIZON &nbsp;·&nbsp; 新标签页已重构</div>

    <nav class="tiles" id="tiles"></nav>
  </main>

  <div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem("nh84:" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("nh84:" + k, JSON.stringify(v)); } catch (e) {} }
  };

  const toastEl = $("#toast");
  function say(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(say._t);
    say._t = setTimeout(() => toastEl.classList.remove("show"), 2200);
  }

  /* ---------- mode ---------- */
  const root = document.documentElement;
  function applyMode(m) {
    root.dataset.mode = m;
    $("#btnMode").textContent = m === "day" ? "☀" : "☾";
  }
  applyMode(store.get("mode", "night"));
  $("#btnMode").addEventListener("click", () => {
    const next = root.dataset.mode === "day" ? "night" : "day";
    store.set("mode", next);
    applyMode(next);
    say(next === "day" ? "昼间模式" : "夜间模式");
  });

  /* ---------- clock ---------- */
  const clock = $("#clock");
  const dateEl = $("#date");
  const week = ["日", "一", "二", "三", "四", "五", "六"];
  let showSec = store.get("showSec", false);
  let secEl = null;

  function renderClock() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, "0");
    const mm = String(now.getMinutes()).padStart(2, "0");
    clock.firstChild.nodeValue = hh + ":" + mm;
    dateEl.textContent =
      now.getFullYear() + "." + String(now.getMonth() + 1).padStart(2, "0") + "." +
      String(now.getDate()).padStart(2, "0") + "  周" + week[now.getDay()];
    if (showSec) {
      if (!secEl) {
        secEl = document.createElement("span");
        secEl.className = "sec";
        clock.insertBefore(secEl, dateEl);
      }
      secEl.textContent = String(now.getSeconds()).padStart(2, "0");
    } else if (secEl) {
      secEl.remove();
      secEl = null;
    }
  }
  renderClock();
  setInterval(renderClock, 1000);
  clock.addEventListener("click", () => {
    showSec = !showSec;
    store.set("showSec", showSec);
    renderClock();
    say(showSec ? "已显示秒" : "已隐藏秒");
  });

  /* ---------- search ---------- */
  const q = $("#q");
  const suggestEl = $("#suggest");
  const SUGGEST_MAX = 8;
  let rows = [];
  let activeIdx = -1;

  const isUrl = (s) => /^(https?:\/\/|www\.)|^[\w-]+(\.[\w-]+)+(\/|$)/.test(s);

  /* 搜索历史：最近 200 条；频次表：{ 词: 次数 } */
  const getHistory = () => store.get("history", []);
  const getCounts = () => store.get("counts", {});

  function remember(raw) {
    const key = raw.trim();
    if (!key) return;
    const hist = getHistory().filter((h) => h.q !== key);
    hist.unshift({ q: key, t: Date.now() });
    store.set("history", hist.slice(0, 200));
    const counts = getCounts();
    counts[key] = (counts[key] || 0) + 1;
    store.set("counts", counts);
  }
  function forget(key) {
    store.set("history", getHistory().filter((h) => h.q !== key));
  }
  function frequent(limit) {
    return Object.entries(getCounts())
      .sort((a, b) => b[1] - a[1] || 0)
      .slice(0, limit)
      .map(([k, n]) => ({ q: k, n }));
  }

  const escapeHtml = (s) =>
    s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* 命中片段高亮（大小写不敏感，只取第一处） */
  function highlight(text, term) {
    const t = term.trim();
    if (!t) return escapeHtml(text);
    const i = text.toLowerCase().indexOf(t.toLowerCase());
    if (i < 0) return escapeHtml(text);
    return escapeHtml(text.slice(0, i)) + "<b>" + escapeHtml(text.slice(i, i + t.length)) + "</b>" +
           escapeHtml(text.slice(i + t.length));
  }

  const SEEDS = ["deepseek 使用技巧", "bilibili 番剧", "github pages 自定义域名", "edge 主题推荐"];

  function buildRows(term) {
    const t = term.trim().toLowerCase();
    const out = [];
    if (!t) {
      getHistory().slice(0, 5).forEach((h) => out.push({ kind: "history", q: h.q }));
      frequent(5).forEach((f) => {
        if (!out.some((r) => r.q === f.q)) out.push({ kind: "frequent", q: f.q, n: f.n });
      });
      /* 全新用户：给几条推荐，面板不至于空着 */
      if (!out.length) SEEDS.forEach((s) => out.push({ kind: "seed", q: s }));
    } else {
      getHistory().filter((h) => h.q.toLowerCase().includes(t)).slice(0, 6)
        .forEach((h) => out.push({ kind: "history", q: h.q }));
      frequent(30)
        .filter((f) => f.q.toLowerCase().includes(t) && !out.some((r) => r.q === f.q))
        .slice(0, 4)
        .forEach((f) => out.push({ kind: "frequent", q: f.q, n: f.n }));
      /* 还没攒下历史时，让输入也有反馈 */
      if (!out.length) {
        SEEDS.filter((s) => s.toLowerCase().includes(t)).slice(0, 4)
          .forEach((s) => out.push({ kind: "seed", q: s }));
      }
    }
    return out.slice(0, SUGGEST_MAX);
  }

  function renderSuggest() {
    rows = buildRows(q.value);
    activeIdx = -1;
    if (!rows.length) { suggestEl.hidden = true; suggestEl.innerHTML = ""; return; }

    let html = "";
    let lastKind = null;
    rows.forEach((r, i) => {
      if (r.kind !== lastKind) {
        const label = r.kind === "history" ? "搜索历史" : r.kind === "frequent" ? "常用" : "推荐";
        html += '<div class="sec">' + label + "</div>";
        lastKind = r.kind;
      }
      html +=
        '<div class="row" data-i="' + i + '">' +
        '<span class="ico">' + (r.kind === "history" ? "↺" : r.kind === "frequent" ? "★" : "⌕") + "</span>" +
        '<span class="txt">' + highlight(r.q, q.value) + "</span>" +
        (r.kind === "frequent" && r.n ? '<span class="n">×' + r.n + "</span>" : "") +
        (r.kind === "history" ? '<span class="del" title="从历史中删除">✕</span>' : "") +
        "</div>";
    });
    html +=
      '<div class="foot"><span>' + rows.length + " 条建议</span>" +
      '<button id="clrHist" type="button">清除搜索历史</button></div>';

    suggestEl.innerHTML = html;
    suggestEl.hidden = false;

    suggestEl.querySelectorAll(".row").forEach((el) => {
      el.addEventListener("mousedown", (e) => {
        const del = e.target.closest(".del");
        if (del) {
          e.preventDefault();
          forget(rows[+el.dataset.i].q);
          renderSuggest();
          q.focus();
          return;
        }
        e.preventDefault();
        q.value = rows[+el.dataset.i].q;
        closeSuggest();
        go(false);
      });
    });
    const clr = suggestEl.querySelector("#clrHist");
    if (clr) {
      clr.addEventListener("mousedown", (e) => {
        e.preventDefault();
        store.set("history", []);
        renderSuggest();
        q.focus();
        say("已清除搜索历史");
      });
    }
  }

  function closeSuggest() {
    suggestEl.hidden = true;
    activeIdx = -1;
  }
  function moveActive(delta) {
    if (!rows.length) return;
    activeIdx = (activeIdx + delta + rows.length) % rows.length;
    const els = suggestEl.querySelectorAll(".row");
    els.forEach((el, i) => el.classList.toggle("active", i === activeIdx));
    if (els[activeIdx]) els[activeIdx].scrollIntoView({ block: "nearest" });
  }

  function go(forceNewTab) {
    const raw = q.value.trim();
    if (!raw) return;
    remember(raw);
    if (!isUrl(raw)) {
      const target = "https://www.bing.com/search?q=" + encodeURIComponent(raw);
      if (forceNewTab) window.open(target, "_blank");
      else location.href = target;
      return;
    }
    const target = raw.startsWith("http") ? raw : "https://" + raw;
    if (forceNewTab) window.open(target, "_blank");
    else location.href = target;
  }

  $("#search").addEventListener("submit", (e) => { e.preventDefault(); closeSuggest(); go(false); });
  q.addEventListener("input", renderSuggest);
  q.addEventListener("focus", renderSuggest);
  q.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); moveActive(1); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); moveActive(-1); return; }
    if (e.key === "Escape") { if (!suggestEl.hidden) { e.preventDefault(); closeSuggest(); } else q.blur(); return; }
    if (e.key === "Enter") {
      e.preventDefault();
      if (activeIdx >= 0 && rows[activeIdx]) {
        q.value = rows[activeIdx].q;
        closeSuggest();
        go(e.ctrlKey || e.metaKey);
        return;
      }
      closeSuggest();
      go(e.ctrlKey || e.metaKey);
    }
  });
  document.addEventListener("mousedown", (e) => {
    if (!suggestEl.hidden && !e.target.closest(".search-wrap")) closeSuggest();
  });
  window.addEventListener("keydown", (e) => {
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (e.key === "/" && !typing) { e.preventDefault(); q.focus(); q.select(); }
  });

  /* ---------- editable shortcuts ---------- */
  const DEFAULT_TILES = [
    { name: "B 站", url: "https://www.bilibili.com" },
    { name: "DeepSeek", url: "https://chat.deepseek.com" },
    { name: "GitHub", url: "https://github.com" },
    { name: "知乎", url: "https://www.zhihu.com" },
    { name: "网盘", url: "https://pan.baidu.com" }
  ];
  const tilesEl = $("#tiles");

  function renderTiles() {
    const list = store.get("tiles", DEFAULT_TILES);
    tilesEl.innerHTML = "";
    list.forEach((t, i) => {
      const a = document.createElement("a");
      a.href = t.url;
      a.target = "_blank";
      a.rel = "noreferrer";
      const label = document.createElement("span");
      label.textContent = t.name;
      a.appendChild(label);
      const del = document.createElement("span");
      del.className = "del";
      del.textContent = "✕";
      del.title = "删除";
      del.addEventListener("click", (e) => {
        e.preventDefault(); e.stopPropagation();
        store.set("tiles", list.filter((_, k) => k !== i));
        renderTiles();
        say("已删除「" + t.name + "」");
      });
      a.appendChild(del);
      tilesEl.appendChild(a);
    });
    const add = document.createElement("a");
    add.className = "add";
    add.href = "#";
    add.textContent = "＋ 添加";
    add.addEventListener("click", (e) => {
      e.preventDefault();
      const name = prompt("名称（比如：小红书）");
      if (!name) return;
      const url = prompt("网址（https://…）", "https://");
      if (!url || url === "https://") return;
      store.set("tiles", list.concat([{ name: name.trim(), url: url.trim() }]));
      renderTiles();
      say("已添加「" + name + "」");
    });
    tilesEl.appendChild(add);
  }
  renderTiles();

  $("#btnEdit").addEventListener("click", () => {
    document.body.classList.toggle("editing");
    const on = document.body.classList.contains("editing");
    $("#btnEdit").classList.toggle("on", on);
    say(on ? "编辑模式：点 ✕ 删除，点「＋ 添加」新增" : "已退出编辑模式");
  });

  q.focus({ preventScroll: true });
})();
</script>
</body>
</html>
